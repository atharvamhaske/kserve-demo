// hourly counter. Decode is slowed to 24 tokens a second so the stream reads.
const REQUEST = { promptTokens: 32, completionTokens: 96, decodePerSecond: 16 };

// The hops, in the order the request crosses them (open-source-hub-workshop/README.md,
// "Component flow"). `station` is the machine part each version builds for it.
const STATIONS = [
  { id: "client", name: "Client", does: "POST /v1/chat/completions · Bearer key · model qwen3-0.6b" },
  { id: "dns", name: "DNS + LoadBalancer", does: "nip.io resolves to the Gateway's LoadBalancer · :443" },
  { id: "tls", name: "Envoy Gateway · TLS", does: "HTTPS terminated with the cert-manager certificate" },
  { id: "key", name: "Envoy Gateway · API key", does: "SecurityPolicy checks the key from InstanceUser chat-app" },
  { id: "route", name: "Envoy AI Gateway · route", does: "reads model, sets x-ai-eg-model, matches the AIGatewayRoute" },
  { id: "meter", name: "Envoy AI Gateway · meter", does: "counts tokens · 300 per key per hour, counters in Valkey" },
  { id: "pick", name: "KServe InferencePool", does: "the endpoint picker chooses a healthy vLLM pod · 1 of 1" },
  { id: "gpu", name: "vLLM on the GPU", does: "Qwen3 0.6B · prefill, then one token at a time · max 2048" },
];
const STATION_INDEX = Object.fromEntries(STATIONS.map((station, index) => [station.id, index]));

// What built the line, before any request (provider-kserve README):
// Instance -> provider-kserve -> LLMInferenceService -> KServe controllers -> objects.
const PROVISION = [
  { id: "instance", label: "Instance qwen-demo", readout: "Instance qwen-demo · from preset " + PRESET.preset },
  { id: "provider", label: "provider-kserve", readout: "provider-kserve reconciles the Instance" },
  { id: "llmisvc", label: "LLMInferenceService", readout: "LLMInferenceService · serving.kserve.io" },
  { id: "objects", label: "Deployment · HPA · Service · Route", readout: "KServe controllers · Deployment, HPA, Service, Route" },
  { id: "weights", label: "weights", readout: "vLLM pulls " + PRESET.modelURI + " onto the GPU" },
  { id: "ready", label: "Ready", readout: "Instance Ready · endpoint written back · 1 of 1 pods" },
];

// The requests the idle tour plays, in order. `key` false sends a bad key.
const TOUR = [
  { key: true, note: "a chat completion" },
  { key: false, note: "the same call with a wrong key" },
  { key: true, note: "a second completion" },
  { key: true, note: "a third, the hour's counter past 256" },
  { key: true, note: "a fourth, refused: 384 of 300 tokens used" },
];

const HOLD = 0.9; // seconds the request rests at a station before the hop acts
const HOP = 1.05;  // seconds to travel between stations

// Build the timeline once: a list of steps with absolute start times.
function timelineOf() {
  const steps = [];
  let t = 0;
  const push = (step) => { step.at = t; t += step.dur; steps.push(step); return step; };

  PROVISION.forEach((stage, index) => push({ kind: "provision", stage: stage.id, index, dur: index === 4 ? 2.8 : 1.6, readout: stage.readout }));
  push({ kind: "idle", dur: 1.2, readout: "ready · waiting for a request" });

  let used = 0; // tokens on the hour's counter
  TOUR.forEach((request, r) => {
    const base = { request: r, key: request.key };
    const travel = (from, to, readout) => push({ ...base, kind: "travel", from, to, dur: HOP, readout });
    const act = (station, dur, readout, extra = {}) => push({ ...base, kind: "act", station, dur, readout, ...extra });

    act("client", HOLD, `POST /v1/chat/completions · ${REQUEST.promptTokens}-token prompt · model ${PRESET.model}`);
    travel("client", "dns", "request leaves the client");
    act("dns", HOLD, `${PRESET.host} → LoadBalancer :443`);
    travel("dns", "tls", "into the Envoy proxy");
    act("tls", 1.4, "TLS · certificate from cert-manager · HTTPS only", { tls: true });
    travel("tls", "key", "to the SecurityPolicy");
    if (!request.key) {
      act("key", 1.3, "401 · key not accepted by the SecurityPolicy", { reject: "401" });
      push({ ...base, kind: "reject", station: "key", code: "401", dur: 1.8, readout: "401 Unauthorized · the request never reaches a model" });
      return;
    }
    act("key", 1.3, `API key ${PRESET.apiKeyUser} · role invoke · accepted`, { keyOk: true });
    travel("key", "route", "to the AI Gateway");
    act("route", 1.4, `model ${PRESET.model} · x-ai-eg-model · AIGatewayRoute matched`, { route: true });
    travel("route", "meter", "to the token meter");
    if (used >= PRESET.tokenLimitPerHour) {
      act("meter", 1.3, `429 · ${used} of ${PRESET.tokenLimitPerHour} tokens this hour`, { reject: "429", used });
      push({ ...base, kind: "reject", station: "meter", code: "429", dur: 1.8, readout: `429 Too Many Requests · quota resets with the hour`, used });
      return;
    }
    act("meter", 1.3, `tokens this hour ${used} of ${PRESET.tokenLimitPerHour} · allowed`, { meter: true, used });
    travel("meter", "pick", "to the InferencePool");
    act("pick", 1.2, `InferencePool · endpoint picker → pod 1 of ${PRESET.replicas}`, { pick: true });
    travel("pick", "gpu", "into the vLLM pod");
    const prefill = 1.4;
    act("gpu", prefill, `prefill · ${REQUEST.promptTokens} tokens · max ${PRESET.maxModelLen}`, { prefill: true, used });
    const decodeDur = REQUEST.completionTokens / REQUEST.decodePerSecond;
    push({ ...base, kind: "decode", station: "gpu", dur: decodeDur, used, readout: null });
    used += REQUEST.promptTokens + REQUEST.completionTokens;
    push({ ...base, kind: "done", station: "gpu", dur: 2.2, used, readout: `data: [DONE] · ${REQUEST.promptTokens + REQUEST.completionTokens} tokens · ${used} of ${PRESET.tokenLimitPerHour} this hour` });
  });
  push({ kind: "reset", dur: 2.4, readout: "a new hour · the token counter returns to 0" });
  return { steps, total: t };
}

const TIMELINE = timelineOf();

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smoothstep = (v) => { const x = clamp01(v); return x * x * (3 - 2 * x); };

// The state of the whole machine at time `t` (seconds, wrapping round the loop).
function poseAt(time) {
  const t = ((time % TIMELINE.total) + TIMELINE.total) % TIMELINE.total;
  let step = TIMELINE.steps[0];
  for (const candidate of TIMELINE.steps) if (candidate.at <= t) step = candidate;
  const u = clamp01((t - step.at) / step.dur);

  // Where the request is: a station id, a hop {from, to, share}, or nowhere.
  let at = null, hop = null, dropping = null, visible = false;
  let tokensOut = 0, used = step.used ?? 0, phase = step.kind;
  if (step.kind === "travel") { hop = { from: step.from, to: step.to, share: smoothstep(u) }; visible = true; }
  else if (step.kind === "act" || step.kind === "decode" || step.kind === "done") { at = step.station; visible = true; }
  else if (step.kind === "reject") { at = step.station; dropping = { code: step.code, share: smoothstep(u) }; visible = u < 0.92; }
  if (step.kind === "decode") tokensOut = Math.min(REQUEST.completionTokens, Math.floor(u * REQUEST.completionTokens));
  if (step.kind === "done") { tokensOut = REQUEST.completionTokens; }
  if (step.kind === "decode") used = step.used + REQUEST.promptTokens + tokensOut;
  if (step.kind === "done") used = step.used;
  // the counter on the dial: prompt tokens land at the meter, output tokens as they decode
  const counter = step.kind === "decode" || step.kind === "done" ? used : step.kind === "act" && step.station === "gpu" ? step.used + REQUEST.promptTokens : step.used ?? (step.kind === "reset" ? Math.round((1 - smoothstep(u)) * lastUsed()) : 0);

  const readout = step.kind === "decode" ? `decode · ${tokensOut} of ${REQUEST.completionTokens} tokens · ${REQUEST.decodePerSecond} tok/s` : step.readout;
  const provision = step.kind === "provision" ? { index: step.index, share: u } : step.kind === "idle" ? { index: PROVISION.length - 1, share: 1 } : null;
  return {
    t, step, u, phase, at, hop, dropping, visible, tokensOut, counter, readout,
    provisioned: step.kind !== "provision",
    provision,
    key: step.key !== false,
    request: step.request ?? -1,
    // station activity 0..1, for the parts that act
    acting: step.kind === "act" || step.kind === "decode" || step.kind === "done" ? { station: step.station, share: u, step } : null,
  };
}

function lastUsed() {
  let used = 0;
  for (const step of TIMELINE.steps) if (step.used !== undefined) used = Math.max(used, step.used);
  return used;
}

// What the card says under the figure at each step: the hop by name, what it
// does (from the workshop and provider-kserve docs) and what to watch move.
const STORY = {
  provision: [
    ["00 · OpenEverest · Instance", `You create Instance ${PRESET.instance} from the ${PRESET.preset} preset: Qwen3 0.6B, one GPU, one replica, Envoy AI Gateway access and ${PRESET.tokenLimitPerHour} tokens per key per hour.`, "The Instance card goes into the console slot."],
    ["00 · provider-kserve reconciles", "provider-kserve watches Instances whose providerRef is provider-kserve and translates this one into KServe resources. It never manages Pods itself.", "The reconciler wheel turns."],
    ["00 · LLMInferenceService", "The provider writes an LLMInferenceService (serving.kserve.io). From here KServe's own controllers do the work.", "The wheel keeps turning."],
    ["00 · KServe creates the objects", "KServe Standard mode creates a Deployment, an HPA, a Service and the route for the model. Envoy AI Gateway gets an AIGatewayRoute for qwen3-0.6b.", "Four lamps light, one per object."],
    ["00 · vLLM loads the weights", `The pod pulls ${PRESET.modelURI} and vLLM loads it onto the GPU with a ${PRESET.maxModelLen}-token context and 20% of GPU memory.`, "The bar on the GPU fills as the weights load."],
    ["00 · Ready", `provider-kserve writes the phase and the endpoint back onto the Instance: Ready, https://${PRESET.host}/v1. The UI shows the URL and the API-key dialog.`, "The Ready lamp lights. The line is open."],
  ],
  idle: ["Ready", "The platform waits. Nothing runs until a client calls the endpoint.", ""],
  client: ["01 · Client", `Your app sends POST /v1/chat/completions with Authorization: Bearer <key> and model: ${PRESET.model}. The body is a ${REQUEST.promptTokens}-token prompt. Any OpenAI client works unchanged.`, "The capsule is loaded at the terminal."],
  dns: ["02 · DNS + LoadBalancer", `${PRESET.host} resolves to the Gateway's LoadBalancer IP. Port 443 is the only listener for models; port 80 answers ACME challenges and nothing else.`, "The resolver lamp lights."],
  tls: ["03 · Envoy Gateway · TLS", "Envoy terminates HTTPS with the certificate cert-manager issued for the Gateway. API keys are accepted only over TLS. Inside the cluster the request continues as plain HTTP.", "The airlock doors drop and lift."],
  key: ["04 · API key check", `A SecurityPolicy on the Gateway checks the Bearer key. The key came from InstanceUser ${PRESET.apiKeyUser} (the User Management plugin), is stored in a Secret, and allows only this model (role invoke).`, "The turnstile turns a quarter."],
  key401: ["04 · 401 Unauthorized", "The key is unknown or belongs to another model. Envoy answers 401 before the request reaches any model, so a bad key costs no GPU time.", "The gate drops and the capsule falls into the 401 bin."],
  route: ["05 · Agent Router (Envoy AI Gateway)", `The AI Gateway reads the OpenAI model field, sets x-ai-eg-model: ${PRESET.model} and matches the AIGatewayRoute for that model. Other models on the same endpoint have their own routes.`, "The carousel turns to put the matching route in line."],
  meter: ["06 · Token meter", `The Gateway meters tokens per key and per model (gen_ai_client_token_usage) and checks the hourly limit, ${PRESET.tokenLimitPerHour} tokens per key, with counters in Valkey. Without Valkey the limit is not enforced.`, "The dial shows this hour's count so far."],
  meter429: ["06 · 429 Too Many Requests", `This key has already spent more than its ${PRESET.tokenLimitPerHour} tokens this hour, so the Gateway refuses the request before it reaches vLLM. The counter resets with the hour.`, "The gate drops and the capsule falls into the 429 bin."],
  pick: ["07 · KServe InferencePool", `The route's backend is a KServe InferencePool. Its endpoint picker chooses a healthy vLLM pod; here there is one replica, so pod 1 of ${PRESET.replicas}.`, "The selector arm swings to pod 1."],
  prefill: ["08 · vLLM · prefill", `vLLM reads the whole ${REQUEST.promptTokens}-token prompt in one pass on the GPU and fills the KV cache. Then it generates.`, "The fan spins up and the bar starts."],
  decode: ["08 · vLLM · decode", "One token per forward pass over all 0.6B parameters, streamed back as SSE data: chunks through the same Gateway. The client reads them as they arrive.", "Ticks run along the tape toward the client."],
  done: ["08 · data: [DONE]", `${REQUEST.completionTokens} tokens generated. The Gateway adds ${REQUEST.promptTokens + REQUEST.completionTokens} tokens (prompt + completion) to this key's hourly counter and to the metrics.`, `The dial moves up by ${REQUEST.promptTokens + REQUEST.completionTokens}.`],
  reset: ["A new hour", `The quota is per key per hour. When the hour rolls over the counter returns to 0 and ${PRESET.apiKeyUser} can call again.`, "The dial winds back to zero."],
};
function storyOf(step) {
  if (step.kind === "provision") return STORY.provision[step.index];
  if (step.kind === "idle") return STORY.idle;
  if (step.kind === "reset") return STORY.reset;
  if (step.kind === "travel") { const next = storyOf({ kind: "act", station: step.to, key: step.key }); return ["→ " + next[0], next[1], next[2]]; }
  if (step.kind === "decode") return STORY.decode;
  if (step.kind === "done") return STORY.done;
  if (step.kind === "reject") return step.code === "401" ? STORY.key401 : STORY.meter429;
  if (step.station === "key") return step.reject ? STORY.key401 : STORY.key;
  if (step.station === "meter") return step.reject ? STORY.meter429 : STORY.meter;
  if (step.station === "gpu") return STORY.prefill;
  return STORY[step.station];
}
// Which station is "on" during a step, for the highlight.
function focusOf(step) {
  if (step.kind === "provision" || step.kind === "idle") return "console";
  if (step.kind === "reset") return "meter";
  if (step.kind === "travel") return step.to;
  return step.station;
}

// The step boundaries, for stepping through with the keyboard.
const BOUNDARIES = TIMELINE.steps.map((step) => step.at);


// Drawing recipes shared by the three figures. Every function takes the kit
// (`k`) and the projection (`P`) and returns SVG strings, so the same code runs
// in the build (Node) and in the page (inlined, with `k` built from the kit's
// globals). Nothing here keeps state.

const TAU = Math.PI * 2;

const byDepth = (k, P, points) => [...points].sort((a, b) => k.depthOf([a[0], a[1], 0], P) - k.depthOf([b[0], b[1], 0], P));
const centreOf = (plan, z = 0) => [plan.x + plan.w / 2, plan.y + plan.d / 2, z];

// A base plate on four feet, with a groove, corner screws, a ruler strip along
// the front and a label plate: the bench everything else stands on.
function basePlate(k, P, plan, { h = 12, footH = 5, strip = true, label = null } = {}) {
  const out = [`<path class="iso-halo" d="${k.haloOf(plan, -h - footH, h, P)}"/>`];
  for (const [x, y] of byDepth(k, P, k.corners(plan, 22))) {
    out.push(k.solidSvg(k.cylinder(x, y, 7, -h - footH, 1.6, P, 28), { tone: "lo" }));
    out.push(k.solidSvg(k.cylinder(x, y, 5.4, -h - footH + 1.6, footH - 1.6, P, 28), { tone: "mid" }));
  }
  out.push(k.solidSvg(k.slabOf(plan, -h, h, P, 8, 1.6), { tone: "mid" }));
  out.push(k.lineSvg(k.planOutline(k.insetPlan(plan, 5), 0, P), { tone: "lo" }));
  const screws = k.corners(plan, 10);
  out.push(k.lineSvg(screws.map(([x, y]) => k.ring(x, y, 2.2, 0, P, 16)).join(""), { tone: "lo" }));
  out.push(k.dotsSvg(screws.map(([x, y]) => k.iso([x, y, 0], P)), { size: 0.5 }));
  if (strip) {
    const s = { x: plan.x + 18, y: plan.y + plan.d - 13, w: plan.w - 36, d: 7, r: 1 };
    out.push(k.solidSvg(k.slabOf(s, 0, 0.6, P, 3), { tone: "lo", crease: "none" }));
    const ticks = k.topTicks(s.x + 4, s.x + s.w - 4, 4, 5, s.y + 0.8, 0.6, [2, 3.6], P);
    out.push(k.lineSvg(ticks.minor, { tone: "lo" }), k.lineSvg(ticks.major, { tone: "mid" }));
    out.push(k.dotsSvg([k.iso([s.x + 2, s.y + 3.5, 0.6], P), k.iso([s.x + s.w - 2, s.y + 3.5, 0.6], P)], { size: 0.45 }));
  }
  if (label) out.push(labelPlate(k, P, label, 0));
  return out.join("");
}

// A small engraved label plate: three rule lines standing for printed text.
function labelPlate(k, P, plan, z) {
  const out = [];
  out.push(k.solidSvg(k.slabOf(plan, z, 0.8, P, 4), { tone: "lo", crease: "none" }));
  out.push(k.lineSvg(k.planOutline(k.insetPlan(plan, 1.6), z + 0.8, P, 4), { tone: "faint" }));
  const lines = [0.78, 0.5, 0.62];
  lines.forEach((share, index) => {
    const y = plan.y + 2.6 + index * ((plan.d - 5.2) / 2);
    out.push(k.lineSvg(k.lineOnTop([plan.x + 3, y], [plan.x + 3 + (plan.w - 6) * share, y], z + 0.8, P), { tone: "lo", free: true }));
  });
  out.push(k.dotsSvg([k.iso([plan.x + 1.6, plan.y + plan.d / 2, z + 0.8], P), k.iso([plan.x + plan.w - 1.6, plan.y + plan.d / 2, z + 0.8], P)], { size: 0.4 }));
  return out.join("");
}

// A box with a lid line, an inset top outline and corner screws: an equipment
// housing. `lit` raises it when the station is the one to watch.
function housing(k, P, plan, z, h, { tone = "mid", lid = 0.35, screws = true, steps = 4, bevel = 0.6, lit = false, inner = "" } = {}) {
  const out = [];
  const seam = h > 8 ? k.sideSeam(plan, z + h * lid, P, steps) : "";
  out.push(k.solidSvg(k.slabOf(plan, z, h, P, steps, bevel), { tone, lit, inner: (seam ? k.lineSvg(seam, { tone: "faint" }) : "") + inner }));
  out.push(k.lineSvg(k.planOutline(k.insetPlan(plan, 2.2), z + h, P, steps), { tone: "faint" }));
  if (screws) out.push(k.dotsSvg(k.corners(plan, 3.2).map(([x, y]) => k.iso([x, y, z + h], P)), { size: 0.42 }));
  return out.join("");
}

// A small indicator lamp: a bezel ring and a dome, lit or dark.
function lamp(k, P, x, y, z, { on = false, r = 2.2 } = {}) {
  const out = [];
  out.push(k.solidSvg(k.cylinder(x, y, r + 0.9, z, 0.9, P, 18), { tone: "lo", crease: "none" }));
  out.push(k.solidSvg(k.cylinder(x, y, r, z + 0.9, 1.6, P, 18), { tone: on ? "hi" : "mid", lit: on, crease: on ? "lo" : "faint" }));
  if (on) out.push(k.dotsSvg([k.iso([x, y, z + 2.5], P)], { size: 0.9, tone: "hi" }));
  return out.join("");
}

// A knurled knob with a pointer line on top.
function knob(k, P, x, y, z, r, h, { pointer = 0 } = {}) {
  const out = [];
  out.push(k.solidSvg(k.cylinder(x, y, r, z, h, P, 24), { tone: "mid" }));
  out.push(k.lineSvg(k.knurl(x, y, r, z, z + h, Math.round(r * 5), P), { tone: "lo" }));
  const a = pointer;
  out.push(k.lineSvg(k.lineOnTop([x, y], [x + Math.cos(a) * (r - 0.8), y + Math.sin(a) * (r - 0.8)], z + h, P), { tone: "hi", free: "start" }));
  out.push(k.dotsSvg([k.iso([x, y, z + h], P)], { size: 0.45, tone: "hi" }));
  return out.join("");
}

// A dial that reads a share of a range: a puck with a knurled bezel, ticks,
// a zero mark and a red-zone arc. The needle is drawn separately (`needle`).
const DIAL_FROM = -Math.PI * 0.75; // angle 0 points to -y; the sweep is 270° clockwise
const DIAL_SPAN = Math.PI * 1.5;
function dial(k, P, x, y, z, r, { ticks = 30, every = 5, h = 6, limitShare = null } = {}) {
  const top = z + h;
  const out = [];
  out.push(k.solidSvg(k.cylinder(x, y, r, z, h, P, 56, 0.6), { tone: "hi", crease: "lo" }));
  out.push(k.lineSvg(k.knurl(x, y, r, top - 2.4, top, 64, P, 0.3), { tone: "lo" }));
  out.push(k.lineSvg(k.sideArc(x, y, r, top - 2.4, P, 36), { tone: "faint" }));
  out.push(k.lineSvg(k.ring(x, y, r - 1.8, top, P, 56), { tone: "lo" }));
  const t = k.radialTicks(x, y, r - 2.6, ticks, every, top, [1.2, 2.6], P, DIAL_FROM, DIAL_SPAN);
  out.push(k.lineSvg(t.minor, { tone: "lo" }), k.lineSvg(t.major, { tone: "mid" }));
  if (limitShare !== null) {
    // the over-limit zone: a denser row of short ticks from the limit to the end of the sweep
    const from = DIAL_FROM + DIAL_SPAN * limitShare;
    const zone = k.radialTicks(x, y, r - 2.6, 10, 1, top, [1.6, 1.6], P, from, DIAL_SPAN * (1 - limitShare));
    out.push(k.lineSvg(zone.major, { tone: "hi" }));
  }
  out.push(k.lineSvg(k.ring(x, y, 1.5, top, P, 14), { tone: "mid" }));
  return out.join("");
}
function needle(k, P, x, y, top, r, share, { tone = "lit" } = {}) {
  const a = DIAL_FROM + DIAL_SPAN * Math.min(1.04, Math.max(0, share)) - Math.PI / 2;
  const tail = [x - Math.cos(a) * 3, y - Math.sin(a) * 3];
  const tip = [x + Math.cos(a) * (r - 3.6), y + Math.sin(a) * (r - 3.6)];
  return k.lineSvg(k.lineOnTop(tail, tip, top + 0.2, P), { tone, free: true }) + k.dotsSvg([k.iso([x, y, top + 0.2], P)], { size: 0.5, tone: "hi" });
}

// A counter window on a vertical face (facing +y): a recessed slot showing digits.
function counterWindow(k, P, x, y, z, w, h, text, { tone = "hi", size = 3.2 } = {}) {
  const out = [];
  const plane = k.sideMatrix([x, y], z, P, "left");
  const slot = k.pathOf(k.roundedPlan({ x: 0, y: -h, w, d: h, r: 1 }, 4).map(([u, v]) => [u, v]), true);
  out.push(`<g transform="${plane}"><path class="iso-fill" d="${slot}"/><path class="iso-line" data-tone="lo" d="${slot}"/></g>`);
  out.push(k.faceTextSvg(k.sideMatrix([x + w / 2, y], z + (h - size * 0.7) / 2, P, "left"), text, { size, tone, anchor: "middle" }));
  return out.join("");
}

// A sorted layer: items with depth keys, drawn back to front. Live items carry
// a name so the page can rebuild them.
function layerSvg(items) {
  return `<g data-layer>${[...items].sort((a, b) => a.key - b.key).map((item) => `<g data-k="${item.key.toFixed(2)}"${item.name ? ` data-live="${item.name}"` : ""}${item.station ? ` data-station="${item.station}"` : ""}>${item.svg}</g>`).join("")}</g>`;
}

// The screen box of a world box, for hover regions.
function screenBox(k, P, plan, z0, z1) {
  const pts = k.boxCorners(plan, z0, z1).map((p) => k.iso(p, P));
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)].map((v) => Math.round(v * 10) / 10);
}

// Lay labels out in bands that follow the bench: back-row labels sorted by
// their pin's x in staggered rows above the back edge, front labels (`below`)
// in rows under the front edge. Each label keeps its slot near its pin and is
// pushed sideways only as far as its row's neighbours need. The leader rises
// (or drops) from the pin to just beyond the bench edge, then runs straight to
// the label, so sorted leaders never cross.
function stripLabels(k, P, labels, edges, obstacles = [], { width, height, nameSize = 7.4, lineSize = 6.2, rows = 3, rowStep = 46, rowsBelow = 4, rowStepBelow = 24, gap = 16, gapX = 14 } = {}) {
  const yOn = (line, x) => {
    const [a, b] = line;
    const t = Math.min(1, Math.max(0, (x - a[0]) / (b[0] - a[0] || 1)));
    return a[1] + (b[1] - a[1]) * t;
  };
  const measure = (label) => {
    const [ax, ay] = k.iso(label.at, P);
    const w = ((label.n ? label.n.length + 3 : 0) + label.name.length) * nameSize * 0.72;
    const w2 = label.line.length * lineSize * 0.74;
    return { ...label, ax, ay, w: Math.max(w, w2) + 4, nameSize, lineSize };
  };
  const place = (group, below) => {
    const sorted = group.map(measure).sort((a, b) => a.ax - b.ax);
    const nRows = below ? Math.min(rowsBelow, sorted.length) : Math.min(rows, Math.max(1, Math.ceil(sorted.length / 3)));
    const stepHere = below ? rowStepBelow : rowStep;
    sorted.forEach((label, i) => { label.row = i % nRows; label.x = label.ax - 2; });
    for (let r = 0; r < nRows; r++) {
      const row = sorted.filter((l) => l.row === r);
      for (let i = 1; i < row.length; i++) row[i].x = Math.max(row[i].x, row[i - 1].x + row[i - 1].w + gapX);
      for (let i = row.length - 1; i >= 0; i--) {
        const limit = i === row.length - 1 ? width - 8 : row[i + 1].x - gapX;
        row[i].x = Math.min(row[i].x, limit - row[i].w);
      }
      for (let i = 0; i < row.length; i++) row[i].x = Math.max(8, row[i].x);
    }
    for (const label of sorted) {
      const x0 = label.x, x1 = label.x + label.w;
      // one straight band for the whole group, beyond the edge's extreme point, so a tilted bench can't stack rows
      const edgeAt = below ? Math.max(edges.front[0][1], edges.front[1][1]) : Math.min(edges.back[0][1], edges.back[1][1]);
      label.ly = below ? edgeAt + gap + nameSize + label.row * stepHere : edgeAt - gap - lineSize - 4 - label.row * stepHere;
      // clear any block that rises past the edge under this label's span
      for (const [id, ob] of obstacles) {
        if (ob[2] < x0 - 2 || ob[0] > x1 + 2) continue;
        if (below) label.ly = Math.max(label.ly, ob[3] + gap + nameSize + label.row * stepHere * 0.5);
        else label.ly = Math.min(label.ly, ob[1] - gap - lineSize - 4 - label.row * stepHere * 0.5);
      }
      label.ly = Math.max(nameSize + 4, Math.min(height - lineSize - 8, label.ly));
    }
    // resolve any pair still overlapping (an obstacle can push a label into another row)
    for (let pass = 0; pass < 12; pass++) {
      let moved = false;
      for (const a of sorted) for (const b of sorted) {
        if (a === b || a.x + a.w + 6 <= b.x || b.x + b.w + 6 <= a.x) continue;
        const aTop = a.ly - nameSize, aBot = a.ly + lineSize + 4, bTop = b.ly - nameSize, bBot = b.ly + lineSize + 4;
        if (aBot + 3 <= bTop || bBot + 3 <= aTop) continue;
        const mover = below ? (a.ly > b.ly ? a : b) : (a.ly < b.ly ? a : b);
        mover.ly += below ? (aBot > bBot ? aBot : bBot) - mover.ly + nameSize + 4 : -((aTop < bTop ? bTop : aTop) - mover.ly + lineSize + 8);
        moved = true;
      }
      if (!moved) break;
    }
    for (const label of sorted) {
      const x0 = label.x, x1 = label.x + label.w;
      label.box = [x0, label.ly - nameSize, x1, label.ly + lineSize + 4];
      const edge = below ? yOn(edges.front, label.ax) + 8 : yOn(edges.back, label.ax) - 8;
      const knee = below ? Math.max(edge, label.ay + 6) : Math.min(edge, label.ay - 6);
      label.leader = [[label.ax, label.ay], [label.ax, knee], [label.x + 1.5, below ? label.box[1] - 2 : label.box[3] + 1]];
    }
    return sorted;
  };
  return [...place(labels.filter((l) => !l.below), false), ...place(labels.filter((l) => l.below), true)];
}

// At the back, the OpenEverest console that built the line.

// A heat-sink: thin fins standing on a block's top, along x.
function finsOn(k, P, plan, z, count, h) {
  const out = [];
  const gap = (plan.w - 2) / (count - 1);
  for (let i = 0; i < count; i++) {
    out.push(k.solidSvg(k.slabOf({ x: plan.x + 1 + i * gap - 1, y: plan.y, w: 2, d: plan.d, r: 0.4 }, z, h, P, 2), { tone: "mid", crease: "faint" }));
  }

// --- live parts --------------------------------------------------------------
function capsulePosition(pose) {

  if (!pose.visible) return null;
  const z = BED_TOP;
  if (pose.hop) {
    const a = SX[pose.hop.from], b = pose.hop.to === "gpu" ? GPU.lintel.x + 38 : SX[pose.hop.to];
    return [a + (b - a) * pose.hop.share, 0, z];
  }
  if (pose.dropping) {
    const bin = BIN[pose.at];
    const s = pose.dropping.share;
    const x = SX[pose.at], y0 = 0, y1 = bin.y + bin.d / 2;
    const lift = Math.sin(Math.PI * Math.min(1, s * 1.2)) * 10;
    return [x, y0 + (y1 - y0) * s, s < 0.7 ? z + lift : Math.max(BED_Z + 1.6, z - 2 - (s - 0.7) * 12)];
  }
  if (pose.at === "gpu") return [GPU.lintel.x + 38, 0, z];
  return [SX[pose.at], 0, z];
}

function live(k, P, pose, extra = {}) {

  const pulse = (s) => Math.sin(Math.PI * s); // 0 → 1 → 0 over an act

  // the request capsule: a pill with a band and its key tag

  if (c) {

    const badKey = !pose.key;
    const svg = [
      `<path class="iso-halo" d="${k.haloOf(k.insetPlan(plan, 1), z - 0.2, 0.1, P)}" style="filter:blur(2.5px);opacity:.5"/>`,

      badKey ? k.lineSvg(k.planOutline({ x: x - 3.4, y: y - 2.2, w: 6.8, d: 4.4, r: 1 }, z + CAPSULE_H + 1.4, P, 3), { tone: "lo", dashed: true }) : "",

  // the airlock doors: two slabs that drop from the lintel while TLS is negotiated
  const tls = acting("tls");
  const drop = tls === null ? 0 : pulse(tls) * 9;
  for (const [side, y, bias] of [["doorBack", -4.5, -0.5], ["doorFront", 4.5, 0.5]]) {
    const plan = { x: SX.tls - 2.2, y: y - 3.8, w: 4.4, d: 7.6, r: 0.6 };

    return k.solidSvg(k.extrude(ring, BED_Z + 25, 2.6, P), { tone: keyAct === null ? "mid" : "hi", lit: accepted, crease: "faint" });
  });
  put("vanes", vanes.join("") + k.solidSvg(k.cylinder(SX.key, -13, 3.2, BED_Z + 27.6, 1.6, P, 16), { tone: "mid" }), [SX.key, -13, BED_Z + 26], 1.5);
  put("keyLamp", lamp(k, P, SX.key - 11, -31, BED_Z + 16, { on: accepted }) + lamp(k, P, SX.key + 11, -31, BED_Z + 16, { on: rejected }), [SX.key, -31, BED_Z + 17], 1);
  // the 401 gate in the front wall drops when a request is refused

  const wallAt = (id, name, down) => {
    const x0 = Math.floor((SX[id] - TRACK.from) / 36) * 36 + TRACK.from;
    const plan = { x: x0, y: 8, w: 36.4, d: 2.4, r: 0.5 };

  put("counter", counterWindow(k, P, SX.meter - 9, -20, BED_Z + 13, 18, 5.6, String(pose.counter).padStart(3, "0"), { tone: pose.counter >= PRESET.tokenLimitPerHour ? "lit" : "hi" }), [SX.meter, -20, BED_Z + 10], 1.5);
  const meterAct = acting("meter");

  wallAt("meter", "gate429", pose.dropping && pose.at === "meter" ? 1 : over ? smoothstep((meterAct - 0.5) / 0.4) : 0);
  put("meterLamp", lamp(k, P, SX.meter - 16, -24, BED_Z + 16, { on: meterAct !== null && !over }) + lamp(k, P, SX.meter + 16, -24, BED_Z + 16, { on: over }), [SX.meter, -24, BED_Z + 17], 1);

  // the selector arm: swings from its rest to point at pod 1 and holds while the request is served
  const pickAct = acting("pick");

  const armA = -Math.PI * 0.42 + armShare * (Math.PI * 0.42 + Math.PI * 0.5); // rest points back-left; picked points at +y (over the bed)
  const tip = [SX.pick + Math.cos(armA) * 18, -16 + Math.sin(armA) * 18];
  put("arm", k.lineSvg(k.lineOnTop([SX.pick, -16], tip, BED_Z + 25.2, P), { tone: armShare > 0.9 ? "lit" : "hi", free: "end" }) + k.dotsSvg([k.iso([SX.pick, -16, BED_Z + 25.2], P)], { size: 0.7, tone: "hi" }) + k.solidSvg(k.cylinder(tip[0], tip[1], 1.4, BED_Z + 24.4, 1.6, P, 10), { tone: "hi" }), [tip[0], tip[1], BED_Z + 25], 2);

  const fan = extra.fan || 0;
  const spokes = k.radialTicks(GPU.lintel.x + 38, 0, 11, 7, 1, BED_Z + 40.2, [8.5, 8.5], P, fan, Math.PI * 2);
  put("fan", k.lineSvg(spokes.major, { tone: served ? "hi" : "mid", free: true }) + k.solidSvg(k.cylinder(GPU.lintel.x + 38, 0, 2.2, BED_Z + 40, 1.2, P, 12), { tone: "hi" }), [GPU.lintel.x + 38, 0, BED_Z + 41], 6);

  const lamps = [0, 1, 2, 3].map((i) => lamp(k, P, CONSOLE.x + 10 + i * 7, CONSOLE.y + 27, BED_Z + 34, { on: stage > 3 || (stage === 3 && prov.share > i * 0.22) }));

}
