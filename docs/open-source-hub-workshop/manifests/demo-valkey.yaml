apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-valkey
  namespace: everest-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-valkey
  template:
    metadata:
      labels:
        app: demo-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.3-alpine
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-valkey
  namespace: everest-system
spec:
  selector:
    app: demo-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
