<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>LLM Request to Kubernetes</title>
<!--
  DevCon India VIII / FOSSASIA OTS 2026 lightning talk. Each <section> is one
  1920x1080 slide. The diagrams on slides 2 to 6 are Excalidraw scenes
  (src/diagrams/*.excalidraw, written by scripts/diagrams.py) rendered to SVG by
  Excalidraw itself (scripts/render_diagrams.js). Slides 1 and 7 draw their
  few sketch strokes with rough.js, the library Excalidraw uses.
-->
<style>
  /* Poppins, the font of the official DevCon session banner. */
  @font-face { font-family: Poppins; font-weight: 400; src: url(assets/fonts/Poppins-Regular.ttf); }
  @font-face { font-family: Poppins; font-weight: 500; src: url(assets/fonts/Poppins-Medium.ttf); }
  @font-face { font-family: Poppins; font-weight: 600; src: url(assets/fonts/Poppins-SemiBold.ttf); }
  @font-face { font-family: Poppins; font-weight: 700; src: url(assets/fonts/Poppins-Bold.ttf); }

  :root {
    --bg-a: #F4F2FF; --bg-b: #E9E6FB;
    --violet: #7C3AED; --deep: #5B21B6; --soft: #C4B5FD;
    --ink: #1E1B2E; --muted: #5E5A75;
  }
  @page { size: 1920px 1080px; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #D9D4F3; }
  body { font-family: Poppins, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .slide {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 100%);
    break-after: page; page-break-after: always;
  }
  .slide svg.ink { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .abs { position: absolute; }
  img.abs { object-fit: contain; }

  /* Chrome shared by every slide, styled like the session banner. */
  .devcon   { left: 100px; top: 82px; width: 292px; height: 132px; }
  .place    { right: 110px; top: 96px; text-align: right; font: 600 34px/1.25 Poppins, sans-serif; color: var(--violet); }
  .place .date { display: block; font-weight: 400; color: var(--ink); }
  .place .date b { font-weight: 400; color: var(--violet); }
  .place small { display: block; font: 400 20px Poppins, sans-serif; color: var(--muted); margin-top: 6px; }
  .foss     { left: 106px; top: 974px; width: 220px; height: 56px; }
  .divider  { left: 352px; top: 982px; width: 2px; height: 40px; background: var(--soft); }
  .oe       { left: 376px; top: 972px; height: 60px; width: 172px; }
  .pageno   { right: 110px; top: 988px; font: 500 21px Poppins, sans-serif; color: var(--muted); }
  .pageno b { color: var(--violet); font-weight: 600; }

  .kicker   { left: 112px; top: 238px; font: 600 22px Poppins, sans-serif; text-transform: uppercase;
              letter-spacing: .08em; color: var(--violet); }
  .h1       { left: 110px; top: 272px; width: 1700px; font: 500 56px/1.25 Poppins, sans-serif; letter-spacing: -.01em; }
  .h1 em    { font-style: normal; color: var(--violet); }
  .lede     { left: 112px; top: 352px; width: 1500px; font-size: 28px; font-weight: 400; color: var(--muted); line-height: 1.4; }

  .lab      { font-size: 26px; font-weight: 500; line-height: 1.3; text-align: center; }
  .sub      { font: 400 20px/1.35 Poppins, sans-serif; text-align: center; color: var(--muted); }
  .take     { font-weight: 500; color: var(--ink); text-align: center; letter-spacing: -.01em; }
  .desc     { font-size: 23px; font-weight: 400; color: var(--ink); line-height: 1.35; }
  .cell     { font-size: 24px; font-weight: 500; line-height: 1.3; text-align: center; color: var(--ink);
              display: flex; align-items: center; justify-content: center; }
  .diagram  { left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<section class="slide" data-slide="1"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="2"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="3"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="4"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="5"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="6"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>
<section class="slide" data-slide="7"><svg class="ink" viewBox="0 0 1920 1080"></svg></section>

<script src="vendor/rough-4.6.6.js"></script>
<script>
const INK = '#5B21B6', VIO = '#7C3AED', SOFT = '#C4B5FD', TXT = '#1E1B2E', MUTED = '#5E5A75', PAPER = '#FFFFFF';
const TOTAL = 7;

/* ---------- small drawing kit for the sketches on slides 1 and 7 ---------- */
let SEED = 7;
function ctxFor(n) {
  const el = document.querySelector(`section[data-slide="${n}"]`);
  const svg = el.querySelector('svg.ink');
  return { n, el, svg, rc: rough.svg(svg) };
}
const opts = (o = {}) => Object.assign({ stroke: INK, strokeWidth: 3, roughness: 1.1, bowing: 1.1, seed: SEED++ }, o);
const put = (c, node) => (c.svg.appendChild(node), node);
function circle(c, cx, cy, d, o = {}) { put(c, c.rc.ellipse(cx, cy, d, d, opts(Object.assign({ fill: PAPER, fillStyle: 'solid' }, o)))); }
function line(c, pts, o = {}) { const oo = opts(o); put(c, o.curve ? c.rc.curve(pts, oo) : c.rc.linearPath(pts, oo)); }
function underline(c, x1, x2, y) {
  line(c, [[x1, y], [(x1 + x2) / 2, y + 6], [x2, y - 2]], { curve: true, stroke: VIO, strokeWidth: 5, roughness: 1.4 });
}
function text(c, x, y, w, html, cls, style = '') {
  const d = document.createElement('div');
  d.className = 'abs ' + cls;
  d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;` + style;
  d.innerHTML = html;
  c.el.appendChild(d);
  return d;
}
function img(c, src, x, y, w, h, style = '') {
  const i = document.createElement('img');
  i.className = 'abs'; i.src = src; i.alt = '';
  i.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;` + style;
  c.el.appendChild(i);
  return i;
}
/** Footer logos and page number on every slide. The DevCon logo and place line only on the title. */
function chrome(c, top = false) {
  if (top) c.el.insertAdjacentHTML('beforeend', `
    <img class="abs devcon" src="assets/brand/devcon-viii-logo.png" alt="DevCon VIII India">
    <div class="abs place">MUMBAI, INDIA<span class="date"><b>5</b> Nov, 2026</span><small>OTS Main Stage · 16:15 IST</small></div>`);
  c.el.insertAdjacentHTML('beforeend', `
    <img class="abs foss" src="assets/brand/fossasia-ots-logos.png" alt="FOSSASIA and OTS">
    <div class="abs divider"></div>
    <img class="abs oe" src="assets/logos/oe-logo-horizontal-full-color-white.svg" alt="OpenEverest">
    <div class="abs pageno"><b>${c.n}</b> / ${TOTAL}</div>`);
}
function heading(c, kicker, h1) {
  text(c, 112, 88, 1200, kicker, 'kicker');
  text(c, 110, 122, 1700, h1, 'h1');
}
/** A content slide: chrome, heading, and its Excalidraw diagram on top. */
// Each scene is laid out in slide coordinates. FIT gives the vertical centre of its
// content and how far to move it, so it sits centred between the heading and the
// footer, slightly enlarged now that the top of the slide is free.
const FIT = { 2: [732, -126], 3: [648, -68], 4: [643, -63], 5: [688, -108], 6: [655, -75] }, ZOOM = 1.06;
function diagramSlide(n, kicker, h1, lede) {
  const c = ctxFor(n); chrome(c);
  heading(c, kicker, h1);
  if (lede) text(c, 112, 202, 1500, lede, 'lede');
  const [cy, dy] = FIT[n];
  img(c, `diagrams/slide-0${n}.svg`, 0, 0, 1920, 1080,
      `transform-origin:960px ${cy}px;transform:translateY(${dy}px) scale(${ZOOM})`);
}

/* ---------- slides ---------- */
function slide1() {
  const c = ctxFor(1); chrome(c, true);
  c.el.querySelector('.pageno').remove();
  img(c, 'assets/brand/devcon-hero-art.png', 1236, 216, 684, 864);
  text(c, 110, 300, 1130, 'What Actually Happens When You Send an LLM Request to Kubernetes?', 'h1',
       'width:1130px;font-size:70px;line-height:1.32');
  img(c, 'assets/brand/speaker-photo.png', 112, 664, 112, 112);
  circle(c, 168, 720, 124, { fill: 'none', stroke: VIO, strokeWidth: 3 });
  text(c, 250, 672, 800, 'Atharva Mhaske', 'lab', 'text-align:left;font-size:44px;font-weight:400;color:#4B4763');
  text(c, 250, 734, 800, 'Engineer at Cld9.ai', 'desc', 'font-size:25px;color:' + MUTED);
}

const DIAGRAM_SLIDES = [
  [2, 'The problem', 'Where did this request go?',
   'Platform teams ship LLM features fast. In production, one chat completion is rarely one Pod.'],
  [3, 'The path', 'Follow one request, hop by hop'],
  [4, 'Where it breaks', 'Each hop fails in its own way'],
  [5, 'How OpenEverest solved it', 'provider-kserve turns an Instance into an endpoint'],
  [6, 'Same hops, any stack', 'Three stacks, the same four hops'],
];

function slide7() {
  const c = ctxFor(7); chrome(c);
  c.el.querySelector('.pageno').remove();   // the speaker photo owns the bottom-right corner
  text(c, 104, 128, 1000, 'Thank you', 'take', 'text-align:left;font-size:104px;line-height:1.25');
  underline(c, 116, 470, 286);
  text(c, 112, 306, 1100, "Let's connect after the talk.", 'kicker', 'font-size:28px;font-weight:500;letter-spacing:0;text-transform:none');

  text(c, 112, 368, 900, 'Atharva Mhaske', 'lab', 'text-align:left;font-size:46px;font-weight:500');
  const bio = ['AI and Infra Engineer at Cld9.ai', 'Former Google Summer of Code 2026 mentee',
               'Member, OpenTelemetry project', 'I love FOSS and contribute to multiple CNCF projects'];
  bio.forEach((t, i) => {
    const y = 446 + i * 48;
    circle(c, 124, y + 17, 12, { fill: VIO, stroke: INK, strokeWidth: 1.5, roughness: .6 });
    text(c, 146, y - 2, 1000, t, 'desc', 'font-size:26px');
  });
  text(c, 112, 666, 1100, 'Ask me about LLM serving on Kubernetes, KServe or OpenTelemetry.', 'desc',
       'font-size:25px;color:' + MUTED);
  text(c, 112, 736, 900, 'github.com/atharvamhaske', 'lab', 'text-align:left;font-size:30px;font-weight:500;color:' + VIO);

  // the speaker, cut out from the selfie, on a soft violet disc
  circle(c, 1590, 610, 680, { fill: '#E4DEFC', fillStyle: 'solid', stroke: SOFT, strokeWidth: 2.5 });
  img(c, 'assets/brand/speaker-cutout.png', 1282, 176, 602, 904, 'object-fit:cover;object-position:top');
}

Promise.all([400, 500, 600, 700].map(w => document.fonts.load(w + ' 24px Poppins'))).then(() => {
  slide1();
  DIAGRAM_SLIDES.forEach(a => diagramSlide(...a));
  slide7();
  const imgs = [...document.images];
  return Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
}).then(() => { window.__ready = true; });
</script>
</body>
</html>
